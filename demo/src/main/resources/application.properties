spring.application.name=demo

server.port=8082
 
# --- MySQL DataSource ---
# Create the database first in MySQL Workbench: CREATE DATABASE food_fiesta;
spring.datasource.url=jdbc:mysql://localhost:3306/food_fiesta?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=@Harshit58202
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# --- JPA / Hibernate ---
